name: Rook CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'test/**'

  pull_request:

jobs:
  validation-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rook_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, ctype, fileinfo, openssl, PDO, pgsql, tokenizer, xml, gd, exif, pcntl, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create testing environment
        run: |
          cp .env.example .env.testing

          echo "APP_ENV=testing" >> .env.testing
          echo "APP_KEY=" >> .env.testing

          echo "DB_CONNECTION=pgsql" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=5432" >> .env.testing
          echo "DB_DATABASE=rook_test" >> .env.testing
          echo "DB_USERNAME=postgres" >> .env.testing
          echo "DB_PASSWORD=postgres" >> .env.testing

          echo "CACHE_STORE=file" >> .env.testing
          echo "SESSION_DRIVER=file" >> .env.testing
          echo "QUEUE_CONNECTION=sync" >> .env.testing

      - name: Generate app key
        run: php artisan key:generate --env=testing

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run migrations
        env:
          APP_ENV: testing
        run: php artisan migrate:fresh --force

      - name: Run tests
        env:
          APP_ENV: testing
        run: php artisan test